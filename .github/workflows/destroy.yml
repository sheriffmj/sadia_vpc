name: Destroy Terraform Configuration

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm destruction'
        required: true

permissions:
  id-token: write
  contents: read
env:
  TF_INPUT: "false"

jobs:
  destroy:
    if: github.event.inputs.confirm == 'yes'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: envs/dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: ${{ vars.AWS_IAM_ROLE }}
          aws-region: ${{ vars.REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Initialize Terraform
        run: terraform init

      - name: Plan Terraform destruction
        run: terraform plan -destroy -out=tfdestroy -lock-timeout=5m
        env:
          TF_VAR_admin_cidrs: ${{ secrets.ADMIN_CIDRS }}
          TF_VAR_admin_principal_arn: ${{ vars.ADMIN_PRINCIPAL_ARN }}
       
      - name: Apply Terraform destruction
        run: terraform apply -auto-approve tfdestroy